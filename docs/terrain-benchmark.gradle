gradle.projectsEvaluated {
    def mod = gradle.rootProject
    mod.tasks.register('captureAllocationBenchmark', JavaExec) {
        dependsOn mod.tasks.named('testClasses')
        classpath=mod.sourceSets.test.runtimeClasspath+mod.configurations.clientLegacyClasspath
        mainClass='com.redondoguibi.direct.CaptureAllocationBenchmark'
    }
    mod.tasks.register('chunkIndexBenchmark', JavaExec) {
        dependsOn mod.tasks.named('testClasses')
        classpath=mod.sourceSets.test.runtimeClasspath+mod.configurations.clientLegacyClasspath
        mainClass='com.redondoguibi.direct.ChunkIndexBenchmark'
    }
    mod.tasks.register('terrainLookupBenchmark', JavaExec) {
        dependsOn mod.tasks.named('testClasses')
        classpath = mod.sourceSets.test.runtimeClasspath + mod.configurations.clientLegacyClasspath
        mainClass = 'com.redondoguibi.direct.TerrainLookupBenchmark'
    }
    mod.tasks.register('terrainWorkloadBenchmark', JavaExec) {
        dependsOn mod.tasks.named('testClasses')
        classpath=mod.sourceSets.test.runtimeClasspath+mod.configurations.clientLegacyClasspath
        mainClass='com.redondoguibi.direct.TerrainWorkloadBenchmark'
        args mod.providers.gradleProperty('benchmarkLibrary').get()
        args mod.providers.gradleProperty('benchmarkParallel').getOrElse('true')
        args mod.providers.gradleProperty('benchmarkOrder').getOrElse('mixed')
    }
    mod.tasks.register('nativeDepthCostBenchmark', JavaExec) {
        dependsOn mod.tasks.named('testClasses')
        classpath = mod.sourceSets.test.runtimeClasspath + mod.configurations.clientLegacyClasspath
        // Pair an older DLL with its original Java JNI declarations, not today's V2 wrapper.
        def releaseJar = mod.providers.gradleProperty('benchmarkJar').orNull
        if (releaseJar != null) classpath = mod.files(releaseJar) + classpath
        mainClass = 'com.redondoguibi.direct.NativeDepthCostBenchmark'
        args mod.providers.gradleProperty('benchmarkLibrary').get()
        args mod.providers.gradleProperty('benchmarkColorAlias').getOrElse('false')
        args mod.providers.gradleProperty('benchmarkMaterials').getOrElse('false')
    }
    mod.tasks.register('interopWaitBenchmark', JavaExec) {
        dependsOn mod.tasks.named('testClasses')
        classpath=mod.sourceSets.test.runtimeClasspath+mod.configurations.clientLegacyClasspath
        mainClass='com.redondoguibi.direct.InteropWaitBenchmark'
        args mod.providers.gradleProperty('benchmarkLibrary').get()
    }
}
